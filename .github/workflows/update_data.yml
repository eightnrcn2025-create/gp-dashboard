name: Update Dashboard Data

on:
  schedule:
    - cron: '5 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Create credentials.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: echo "$GOOGLE_CREDENTIALS" > credentials.json

      - name: Create .env
        run: |
          echo "GAMEPARK_ACCOUNT=${{ secrets.GAMEPARK_ACCOUNT }}" > .env
          echo "GAMEPARK_PASSWORD=${{ secrets.GAMEPARK_PASSWORD }}" >> .env

      - name: Create directories
        run: mkdir -p data database logs debug

      - name: Run update_data.py
        run: python3 update_data.py

      - name: Commit and push data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/weekly_data.json data/history_cache.json data/debug_last_run.json || true
          git diff --staged --quiet \
            || git commit -m "chore: auto update data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
