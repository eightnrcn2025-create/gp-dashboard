<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Gamepark 数据更新</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0d1117; color:#c9d1d9;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  height:100vh; font-family:-apple-system,sans-serif;
  padding:24px; text-align:center;
}
.spinner {
  width:44px; height:44px;
  border:3px solid #21262d;
  border-top-color:#FF6B35;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin-bottom:20px;
}
@keyframes spin { to { transform:rotate(360deg); } }
h3   { font-size:16px; margin-bottom:10px; color:#e6edf3; }
p    { font-size:13px; color:#8b949e; line-height:1.6; }
code {
  display:inline-block; margin-top:14px;
  background:#1c2128; border:1px solid #30363d;
  padding:10px 18px; border-radius:6px;
  font-size:13px; color:#e3b341;
  font-family:monospace; user-select:all;
}
.ok   { color:#3fb950; font-size:32px; margin-bottom:14px; }
.err  { color:#f85149; font-size:32px; margin-bottom:14px; }
</style>
</head>
<body>
<div class="spinner" id="spinner"></div>
<h3 id="title">正在启动数据更新...</h3>
<p id="msg">尝试连接刷新服务，请稍候</p>

<script>
const REFRESH_URL = 'http://localhost:5002';

async function run() {
  const title   = document.getElementById('title');
  const msg     = document.getElementById('msg');
  const spinner = document.getElementById('spinner');

  // ── 尝试调用 refresh_server ───────────────────────────────────
  let called = false;
  try {
    const res = await fetch(REFRESH_URL + '/refresh', {
      method: 'POST',
      signal: AbortSignal.timeout(3000),
    });
    if (res.ok) {
      called = true;
      const data = await res.json();
      spinner.style.display = 'none';
      document.body.insertAdjacentHTML('afterbegin', '<div class="ok">✓</div>');
      title.textContent = data.status === 'running' ? '更新已在进行中' : '数据更新已启动';
      msg.innerHTML = '约需 30-90 秒。<br>更新完成后请回到看板，数据将自动刷新。<br><br>'
        + '<span style="font-size:12px;color:#6e7681">此窗口将在 4 秒后自动关闭</span>';
      setTimeout(() => window.close(), 4000);
    }
  } catch (_) {}

  // ── 服务未启动：显示手动命令 ─────────────────────────────────
  if (!called) {
    spinner.style.display = 'none';
    document.body.insertAdjacentHTML('afterbegin', '<div class="err">!</div>');
    title.textContent = '刷新服务未运行';
    msg.innerHTML = `请在终端执行以下命令手动更新数据：`;
    document.body.insertAdjacentHTML('beforeend',
      `<code>cd ~/Desktop/gp活动看板 &amp;&amp; python3 update_data.py</code>
       <p style="margin-top:16px;font-size:12px;color:#6e7681">
         执行完成后回到看板，点击"立即刷新"重新加载数据<br>
         或运行 <code style="background:transparent;border:none;color:#e3b341;padding:0">start_all.sh</code> 后再点击刷新按钮
       </p>`
    );
  }
}

run();
</script>
</body>
</html>
